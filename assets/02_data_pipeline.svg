<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">PCA + Clustering Pipeline</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Real chemical measurements → scaling → PCA → K-means → silhouette analysis</text>
<g font-family="Arial" font-size="20" text-anchor="middle">
<rect x="45" y="220" width="190" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="140" y="268" fill="#1e3a8a" font-weight="700">1. Load</text><text x="140" y="306" fill="#334155">178 wines</text><text x="140" y="336" fill="#334155">13 measurements</text>
<rect x="280" y="220" width="190" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="375" y="268" fill="#166534" font-weight="700">2. Scale</text><text x="375" y="306" fill="#334155">zero mean</text><text x="375" y="336" fill="#334155">unit variance</text>
<rect x="515" y="220" width="190" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="610" y="268" fill="#155e75" font-weight="700">3. PCA</text><text x="610" y="306" fill="#334155">rotate axes</text><text x="610" y="336" fill="#334155">retain variance</text>
<rect x="750" y="220" width="190" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="845" y="268" fill="#6b21a8" font-weight="700">4. Cluster</text><text x="845" y="306" fill="#334155">K-means</text><text x="845" y="336" fill="#334155">candidate k values</text>
<rect x="985" y="220" width="170" height="150" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="1070" y="268" fill="#9a3412" font-weight="700">5. Evaluate</text><text x="1070" y="306" fill="#334155">silhouette</text><text x="1070" y="336" fill="#334155">best k</text>
</g>
<g stroke="#2563eb" stroke-width="5"><path d="M235 295 H280"/><path d="M470 295 H515"/><path d="M705 295 H750"/><path d="M940 295 H985"/></g>
<rect x="210" y="455" width="780" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="497" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Why scaling comes first</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">PCA and Euclidean clustering are sensitive to feature scale, so standardized chemistry is essential.</text>
</svg>