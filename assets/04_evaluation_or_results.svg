<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Cluster Evaluation</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Silhouette analysis selects the number of clusters from internal geometry rather than class labels.</text>
<rect x="70" y="180" width="700" height="365" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<line x1="145" y1="485" x2="715" y2="485" stroke="#64748b" stroke-width="2"/><line x1="145" y1="485" x2="145" y2="245" stroke="#64748b" stroke-width="2"/>
<rect x="205" y="355" width="85" height="130" rx="8" fill="#bfdbfe"/><rect x="340" y="270" width="85" height="215" rx="8" fill="#86efac"/><rect x="475" y="315" width="85" height="170" rx="8" fill="#d8b4fe"/><rect x="610" y="350" width="85" height="135" rx="8" fill="#fed7aa"/>
<g font-family="Arial" font-size="20" fill="#334155" text-anchor="middle"><text x="247" y="520">k=2</text><text x="382" y="520">k=3</text><text x="517" y="520">k=4</text><text x="652" y="520">k=5</text></g>
<text x="382" y="245" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">best silhouette</text>
<rect x="835" y="180" width="300" height="365" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="875" y="230" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Selected solution</text>
<text x="875" y="325" font-family="Arial" font-size="70" font-weight="700" fill="#166534">k = 3</text>
<text x="875" y="405" font-family="Arial" font-size="54" font-weight="700" fill="#0f172a">0.5611</text>
<text x="875" y="442" font-family="Arial" font-size="21" fill="#64748b">silhouette score</text>
<text x="875" y="505" font-family="Arial" font-size="19" fill="#475569">Higher means clusters are</text><text x="875" y="532" font-family="Arial" font-size="19" fill="#475569">more compact and separated.</text>
<rect x="260" y="585" width="680" height="55" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
<text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#155e75">Labels are not used to fit PCA or K-means; evaluation remains unsupervised.</text>
</svg>