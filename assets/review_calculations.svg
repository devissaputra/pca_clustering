<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>02 / Calculation and evidence</title><desc>RECORDED SMALL-SAMPLE BENCHMARK | see validation scope</desc><rect width="1200" height="840" fill="#f6f8fc"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#133b65" font-weight="700">02 / Calculation and evidence</text><text x="48" y="111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#526278" font-weight="400">RECORDED SMALL-SAMPLE BENCHMARK | see validation scope</text><rect x="42" y="145" width="1116" height="142" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="145" width="7" height="142" fill="#2365a0"/><text x="65" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#2365a0" font-weight="700">DEFINED CALCULATION</text><text x="65" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">Silhouette(i) = (b(i)-a(i))/max(a(i),b(i)); PCA variance share = eigenvalue / total.</text><text x="60" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#128075" font-weight="700">Selected recorded values (units and context shown)</text><rect x="48" y="345" width="1104" height="51" fill="#eaf0f7"/><text x="63" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">selected k</text><text x="797" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">3</text><text x="950" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><rect x="48" y="401" width="1104" height="51" fill="#ffffff"/><text x="63" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">silhouette full space</text><text x="797" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">0.2849</text><text x="950" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><rect x="48" y="457" width="1104" height="51" fill="#eaf0f7"/><text x="63" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">silhouette pca view</text><text x="797" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">0.5583</text><text x="950" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><rect x="48" y="513" width="1104" height="51" fill="#ffffff"/><text x="63" y="539" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#23354b" font-weight="400">posthoc adjusted rand index</text><text x="797" y="539" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#133b65" font-weight="700">0.8975</text><text x="950" y="539" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#23354b" font-weight="400">unitless</text><text x="48" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#23354b" font-weight="400">Source: results/metrics.json | SHA-256 prefix: 2d7e7f53fbe27be2</text><text x="48" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#23354b" font-weight="400">See CALCULATIONS.md for data status, execution scope and interpretation.</text></svg>
